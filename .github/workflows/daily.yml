name: Daily apartment search

on:
  schedule:
    - cron: "15 4 * * *"   # every day 06:15 Swiss summer time / 05:15 winter time
  workflow_dispatch:        # "Run workflow" button for a manual run
    inputs:
      email:
        description: "Send the e-mail (untick for a test run; new ads are then included in the next e-mail)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape, merge and send e-mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m scraper.run ${{ github.event_name == 'workflow_dispatch' && !inputs.email && '--no-email' || '' }}

      - name: Save data
        if: always()
        run: |
          git config user.name "apartment-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Daily data $(date -u +%F)" || echo "nothing to commit"
          git push
